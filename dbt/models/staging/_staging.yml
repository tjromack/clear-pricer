version: 2

models:
  - name: stg_hpt__files
    tests:
      - grain:
          arguments:
            key: [hospital_id]
    description: One row per staged source file (the current file for each hospital) + its header metadata.
    columns:
      - name: hospital_id
        tests: [unique, not_null]
      - name: source_sha256
        tests: [not_null]
      - name: template_version
        description: Parsers are written against CMS template v3.0.0; any other version fails the run until handled.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["3.0.0"]

  - name: stg_hpt__drift
    description: The parser's unmappable-field / drift log, aggregated per (kind, column).
  - name: stg_hpt__quarantine
    description: Rows the parser could not map at all (raw cells kept).
  - name: stg_hpt__modifiers
    description: Top-level modifier_information (JSON sources), one row per modifier x payer/plan.
  - name: stg_nppes__provider_history
    description: SCD2 NPPES history (one row per NPI x version); maintained by CDC, read-only to dbt.
  - name: stg_nppes__file_log
    description: One row per NPPES file application attempt, with change counts.
  - name: stg_nppes__drift
    description: NPPES header / parse drift per file.
  - name: stg_fhir__bundles
    description: Synthea FHIR R4 bundles (synthetic; no PHI by construction).
  - name: stg_fhir__resources
    description: Synthea FHIR R4 resources (synthetic; no PHI by construction).
  - name: stg_fhir__patients
    description: Synthea FHIR R4 patients (synthetic; no PHI by construction).
  - name: stg_fhir__encounters
