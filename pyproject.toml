[project]
name = "clear-pricer"
version = "0.1.0"
description = "Public hospital price + provider data, cleaned, reconciled, and republished with its failures published."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=16",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "ijson>=3.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
clear-pricer = "clear_pricer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clear_pricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs the full land -> stage -> dbt build pipeline (slower)"]
